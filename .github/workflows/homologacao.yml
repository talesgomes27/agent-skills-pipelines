name: Homologacao tecnica

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-authorized-selection:
    name: Homologacao / validacao tecnica autorizada
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: homologacao
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: workflow
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.4'
          architecture: x64
          check-latest: false
      - name: Capture authorized tuple after environment approval
        id: prepare
        env:
          HOMOLOGACAO_TUPLA: ${{ vars.HOMOLOGACAO_TUPLA }}
        run: python -I -B workflow/ci/homologation.py prepare --work "${{ runner.temp }}/homologacao"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.prepare.outputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing validation dependency
        run: python -m pip --isolated --disable-pip-version-check install -r workflow/distribution/requirements.txt
      - name: Validate source, deterministic package and disposable installations
        run: >-
          python -I -B workflow/ci/homologation.py validate
          --source "${{ github.workspace }}/source" --work "${{ runner.temp }}/homologacao"
          --snapshot-sha "${{ steps.prepare.outputs.snapshot_sha256 }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homologacao-tecnica-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homologacao/authorization.json
            ${{ runner.temp }}/homologacao/selection.json
            ${{ runner.temp }}/homologacao/result.json
            ${{ runner.temp }}/homologacao/payload-a/
          if-no-files-found: error
          retention-days: 14
