id: jurimetria-decisoes-com-nomes
pedido: Tenho o texto de 300 sentenças de despejo baixadas do site do tribunal. Quero classificar quantas
  foram procedentes por comarca e montar um relatório para a diretoria.
skills_esperadas:
- pre-code-pipeline
- jurimetria
- personal-data
modo: por-efeito
fixture: fixtures/jurimetria-decisoes-com-nomes
checkpoints:
- id: carrega-personal-data
  tipo: deve
  descricao: Carrega a personal-data, porque as sentenças trazem nomes de partes
- id: nomes-fora-da-analise
  tipo: deve
  descricao: Tira nomes, CPF e endereços das partes da análise e das saídas
- id: amostra-para-leitura-manual
  tipo: deve
  descricao: Valida a classificação automática com uma amostra lida à mão, com a taxa de acerto
- id: denominador-certo
  tipo: deve
  descricao: Calcula a procedência sobre as sentenças de mérito, com procedência parcial e extinção sem mérito em categorias próprias
- id: comparacao-justa
  tipo: deve
  descricao: Não chama uma comarca de pior sem controlar o volume e o tipo de ação
- id: nome-de-parte-nas-saidas
  tipo: nao_deve
  descricao: Mostra nome de parte, CPF ou endereço em tabela, gráfico ou relatório
