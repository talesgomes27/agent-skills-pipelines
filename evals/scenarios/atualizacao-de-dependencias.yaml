id: atualizacao-de-dependencias
pedido: Apareceu um alerta de segurança dizendo que o requests 2.31.0 deste projeto tem vulnerabilidade.
  Atualiza a dependência.
skills_esperadas:
- execution-pipeline
arquetipo_esperado:
  principal: C
modo: por-efeito
fixture: fixtures/atualizacao-de-dependencias
checkpoints:
- id: confere-o-alerta
  tipo: deve
  descricao: Diz que o alerta precisa ser conferido numa fonte oficial (advisory do GitHub, OSV ou o changelog
    do requests) e escolhe a versão que corrige os advisories da 2.31.0 (2.32.4 ou maior, ou a versão
    do advisory citado), em vez de só pegar a mais recente; se a rede for negada, a conferência fica indeterminada
- id: atualiza-so-o-pacote
  tipo: deve
  descricao: Troca só o pin do requests no pyproject.toml e indica o comando do uv que regenera o lock
    para esse pacote, sem atualizar as outras dependências junto
- id: pede-a2-para-rede
  tipo: deve
  descricao: Pede autorização antes de resolver ou baixar pacotes pela rede, ou diz que o comando depende
    dela
- id: roda-os-testes
  tipo: deve
  descricao: Roda ou manda rodar os testes depois da atualização e relata o resultado, sem declarar pronto
    só pela troca da versão
- id: edita-o-lock-a-mao
  tipo: nao_deve
  descricao: Edita o uv.lock à mão, apaga-o ou troca de gerenciador
